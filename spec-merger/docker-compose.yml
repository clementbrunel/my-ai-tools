services:
  postgres:
    image: postgres:16
    container_name: specmerger-postgres
    environment:
      POSTGRES_DB: specmerger
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: specmerger-backend
    ports:
      - "8091:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/specmerger
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      FRONTEND_URL: ${FRONTEND_URL}
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER_URI: ${OIDC_ISSUER_URI:-}
      OIDC_AUDIENCE: ${OIDC_AUDIENCE:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-}
      MISTRAL_MODEL: ${MISTRAL_MODEL:-}
      # Non-blank default: Spring AI crashes at startup on an empty Mistral API key.
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-disabled}
      MISTRAL_MOCK: ${MISTRAL_MOCK:-false}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      GITLAB_MOCK: ${GITLAB_MOCK:-false}
      GITLAB_GROUP_1_KEY: ${GITLAB_GROUP_1_KEY:-}
      GITLAB_GROUP_1_PATH: ${GITLAB_GROUP_1_PATH:-}
      GITLAB_GROUP_1_TRANSLATION_PATTERNS: ${GITLAB_GROUP_1_TRANSLATION_PATTERNS:-}
      GITLAB_GROUP_1_JAVA_PATTERNS: ${GITLAB_GROUP_1_JAVA_PATTERNS:-}
      GITLAB_GROUP_2_KEY: ${GITLAB_GROUP_2_KEY:-}
      GITLAB_GROUP_2_PATH: ${GITLAB_GROUP_2_PATH:-}
      GITLAB_GROUP_2_TRANSLATION_PATTERNS: ${GITLAB_GROUP_2_TRANSLATION_PATTERNS:-}
      GITLAB_GROUP_2_JAVA_PATTERNS: ${GITLAB_GROUP_2_JAVA_PATTERNS:-}
      TZ: Europe/Paris
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OAUTH2_PROXY_URL: http://oauth2-proxy:4180
      OIDC_LOGOUT_REDIRECT: ${OIDC_LOGOUT_REDIRECT:-}
    container_name: specmerger-frontend
    ports:
      - "3001:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Login Keycloak devant le frontend (nginx → auth_request). Démarré seulement avec le profil
  # "oidc" : COMPOSE_PROFILES=oidc dans .env (avec OIDC_ENABLED=true).
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    container_name: specmerger-oauth2-proxy
    profiles: ["oidc"]
    environment:
      OAUTH2_PROXY_PROVIDER: keycloak-oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URI:-}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OAUTH2_PROXY_CODE_CHALLENGE_METHOD: S256
      OAUTH2_PROXY_SCOPE: openid email profile
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_REDIRECT_URL: ${OIDC_REDIRECT_URL:-}
      OAUTH2_PROXY_WHITELIST_DOMAINS: ${OIDC_WHITELIST_DOMAINS:-}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH2_PROXY_COOKIE_SECRET:-}
      OAUTH2_PROXY_COOKIE_SECURE: ${OAUTH2_PROXY_COOKIE_SECURE:-true}
      OAUTH2_PROXY_COOKIE_HTTPONLY: "true"
      OAUTH2_PROXY_COOKIE_SAMESITE: lax
      # À aligner sur la durée de vie de l'ID token Keycloak (5 min par défaut).
      OAUTH2_PROXY_COOKIE_REFRESH: 4m
      # Mode auth_request : pas d'upstream, nginx proxifie lui-même.
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SKIP_PROVIDER_BUTTON: "true"
      # Renvoie l'ID token (JWT) en `Authorization: Bearer` à nginx, qui le transmet au backend.
      OAUTH2_PROXY_SET_AUTHORIZATION_HEADER: "true"
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: specmerger-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
