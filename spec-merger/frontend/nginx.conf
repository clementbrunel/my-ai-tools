server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # OIDC on/off (OIDC_ENABLED) : docker-entrypoint.d/40-oidc.sh copie la variante voulue de
    # nginx/oidc-{on,off}/ dans conf.d/oidc-*.inc au démarrage du conteneur.
    include /etc/nginx/conf.d/oidc-server.inc;

    # Config runtime lue par le frontend (voir 40-oidc.sh) — jamais protégée : le frontend en a
    # besoin pour savoir s'il doit proposer la déconnexion.
    location = /config.json {
        alias /etc/nginx/conf.d/app-config.json;
        default_type application/json;
        add_header Cache-Control "no-store";
    }

    location / {
        include /etc/nginx/conf.d/oidc-page.inc;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        include /etc/nginx/conf.d/oidc-api.inc;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}
