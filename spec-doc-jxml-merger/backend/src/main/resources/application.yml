spring:
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5434/specmerger}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  ai:
    mistralai:
      api-key: ${MISTRAL_API_KEY:}
      chat:
        base-url: ${MISTRAL_BASE_URL:https://mistral.invalid}
        options:
          model: ${MISTRAL_MODEL:unset}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.specmerger: INFO
