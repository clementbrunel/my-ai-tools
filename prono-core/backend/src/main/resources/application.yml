spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pronocore}
    username: ${DB_USER}
    password: ${DB_PASS}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

resend:
  api-key: ${RESEND_API_KEY:}

app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors:
    extra-origin: ${CORS_EXTRA_ORIGIN:}

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

server:
  port: 8080
  error:
    include-message: always
    include-binding-errors: always

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

logging:
  level:
    com.pronocore: INFO
    com.pronocore.aspect: INFO
    org.springframework.security: WARN

# jolpica-f1 (Ergast-compatible) — source des calendriers, grilles et résultats F1
f1:
  jolpica:
    base-url: https://api.jolpi.ca/ergast/f1

# football-data.org (v4) — plan gratuit couvrant la saison en cours (Ligue 1 et 11 autres
# compétitions majeures) ; competition-code / season sont portés par chaque Competition
# (football_data_competition_code / season), pas ici : ça permet de synchroniser plusieurs
# compétitions foot en parallèle.
football-data:
  base-url: https://api.football-data.org/v4
  api-key: ${FOOTBALL_DATA_API_KEY:}
