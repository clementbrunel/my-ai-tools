server:
  port: 8080

spring:
  application:
    name: my-money-hub
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/mymoneyhub}
    username: ${DB_USER:mymoneyhub}
    password: ${DB_PASS:mymoneyhub}
  servlet:
    multipart:
      # Linxo export covering ~13 years of history in one file
      max-file-size: 50MB
      max-request-size: 50MB
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

mymoneyhub:
  enable-banking:
    base-url: ${ENABLE_BANKING_BASE_URL:https://api.enablebanking.com}
    application-id: ${ENABLE_BANKING_APPLICATION_ID:}
    private-key-path: ${ENABLE_BANKING_PRIVATE_KEY_PATH:}
    # Must be whitelisted on the Enable Banking application; the frontend proxies /api to the backend.
    redirect-url: ${ENABLE_BANKING_REDIRECT_URL:http://localhost:3001/api/enable-banking/callback}
    frontend-url: ${ENABLE_BANKING_FRONTEND_URL:http://localhost:3001/}
    consent-validity-days: ${ENABLE_BANKING_CONSENT_VALIDITY_DAYS:90}
  woob:
    binary-path: ${WOOB_BINARY_PATH:woob}
    timeout: ${WOOB_TIMEOUT:2m}
